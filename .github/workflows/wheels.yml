name: Wheels

# Builds distributable wheels for mosqito-rs across platforms/Python
# versions. Triggered manually, or on a version tag (v*) — by itself,
# neither trigger publishes anywhere; wheels are uploaded as workflow
# artifacts and a crates.io dry-run sanity-checks mosqito-core's
# publishability on every run.
#
# The actual PyPI publish step only runs when a manual dispatch explicitly
# opts in via the `publish_to_pypi` input below — a tag push alone never
# triggers it. It also cannot succeed yet: PyPI trusted publishing (OIDC,
# no stored token) needs a one-time setup at
# https://pypi.org/manage/account/publishing/ for project `mosqito-rs`,
# workflow `wheels.yml`, environment `pypi` — done by whoever owns the PyPI
# project name, not from this repo. A real crates.io release is a separate,
# manual `cargo publish -p mosqito-core` from a maintainer's machine; this
# workflow only ever dry-runs it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish the built wheels/sdist to PyPI (requires trusted publishing to be configured first, see workflow comment)"
        type: boolean
        default: false

jobs:
  build:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4

      # abi3-py39 (Cargo.toml's pyo3 feature set) keeps one wheel per
      # platform/arch compatible with CPython 3.9-3.13, so the interpreter
      # matrix here is just the platform/arch combinations, not per-version —
      # but the interpreter maturin links against still has to actually be
      # present, so this pins 3.9 to match `-i python3.9` below (manylinux's
      # own container images carry every CPython already; macOS/Windows
      # runners need it installed explicitly).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.9
          manylinux: auto
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: rust/dist/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: rust/dist/*

  conformance-check:
    name: Conformance check (built wheel)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-x86_64
          path: dist

      - name: Install the built wheel + test dependencies
        run: |
          pip install --find-links dist mosqito-rs
          pip install pytest scipy numpy

      # Reference corpus (tests/input/, validations/) lives at the repo
      # root, present in this checkout regardless of which wheel was built
      # (`mosqito-rs`'s own MANIFEST.in does not ship it, so it must come
      # from the checkout, not the installed wheel).
      - name: pytest -m conformance
        working-directory: rust
        run: pytest tests/ -v -m conformance

  crates-io-dry-run:
    name: crates.io publishability check (dry run, never uploads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish --dry-run
        working-directory: rust
        run: cargo publish --dry-run -p mosqito-core

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: [build, build-sdist, conformance-check]
    # Only an explicit manual dispatch with the box checked can reach this
    # job — a tag push alone builds and artifact-uploads wheels but never
    # publishes. See this workflow's top comment for the one-time PyPI-side
    # setup this job needs before it can actually succeed.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    environment:
      name: pypi
      url: https://pypi.org/project/mosqito-rs/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC); no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
