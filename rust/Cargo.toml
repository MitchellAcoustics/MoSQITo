[workspace]
resolver = "2"
members = ["crates/mosqito-core", "crates/mosqito-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/MitchellAcoustics/MoSQITo"
authors = ["MoSQITo Developers"]

[workspace.dependencies]
mosqito-core = { path = "crates/mosqito-core", version = "0.1.0" }
ndarray = "0.17"
num-complex = "0.4"
rayon = "1.10"
realfft = "3.5"
rustfft = "6.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
